name: Release

# Run by hand, and on a version tag.
#
# Not on push: a signed artifact at every commit would cost build minutes for
# something nobody waits for, and multiply for no reason the runs that have
# the signing key in their hands.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Create a GitHub release (a draft) with the artifacts"
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Build and sign
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      # RELEASE_VERSION carries the version for the rest of the job. On a tag
      # it comes from the tag itself: the checkout brings one commit and no
      # tags, where `git describe` could only give a hash. Run by hand there
      # is no tag: the variable stays empty and the build keeps that hash as
      # its name rather than make a number up.
      - name: Work out the version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "RELEASE_VERSION=${{ github.ref_name }}" >> "$GITHUB_ENV"
            echo "Version: ${{ github.ref_name }}"
          else
            echo "No tag: an intermediate build, named after its commit."
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      # The SSH tests start the runner's own sshd, as the current user; on
      # Ubuntu it refuses to start without this directory.
      - name: Let sshd start
        run: sudo mkdir -p /run/sshd

      # Checked before it is signed: the same tests as ci.yml.
      - name: Tests
        run: ./gradlew :proto:jvmTest :transport:jvmTest :shared:desktopTest

      # Written to the job's temporary directory and removed at the end: it
      # goes neither through the repository nor through the Gradle cache.
      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The RELEASE_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build the signed APK and bundle
        env:
          RELEASE_KEYSTORE: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease

      # Without this, a key restored wrongly would give an unsigned artifact
      # that nothing would report before the Play Store refuses it.
      - name: Check the artifact is signed
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk

      # Read in the artifact, not assumed from the variable that made it.
      - name: Check the artifact carries the tag's version
        if: github.ref_type == 'tag'
        run: |
          aapt2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -1)
          badging=$("$aapt2" dump badging app/build/outputs/apk/release/app-release.apk | head -1)
          echo "$badging"
          expected="${GITHUB_REF_NAME#v}"
          if ! echo "$badging" | grep -q "versionName='$expected'"; then
            echo "::error::The artifact does not carry version $expected."
            exit 1
          fi

      # The checked bundle goes to internal testing on the Play Console, with
      # the repository's release notes (Gradle Play Publisher). On a tag only.
      # Until the app exists on the Play Console there is no service account:
      # the step then says so and the release goes on without it.
      - name: Publish to internal testing on the Play Store
        if: github.ref_type == 'tag'
        env:
          PLAY_SERVICE_ACCOUNT_JSON_CONTENT: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ runner.temp }}/play-service-account.json
          RELEASE_KEYSTORE: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON_CONTENT" ]; then
            echo "::warning::No PLAY_SERVICE_ACCOUNT_JSON secret: nothing sent to the Play Store."
            exit 0
          fi
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON_CONTENT" > "$PLAY_SERVICE_ACCOUNT_JSON"
          ./gradlew :app:publishReleaseBundle

      - name: Remove the key and the service account
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/play-service-account.json"

      - name: Upload the artifacts
        uses: actions/upload-artifact@v7
        with:
          name: gliff-client-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          retention-days: 30
          if-no-files-found: error

  publication:
    name: Create the GitHub release
    needs: release
    runs-on: ubuntu-latest
    # On a tag, or when asked for: a release goes out to the world, it must
    # not happen as a side effect.
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: gliff-client-release
          path: artifacts

      # Published at once on a tag: tagging a version is the decision to
      # publish it. Run by hand it stays a draft: it matches no version.
      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: ${{ github.ref_type != 'tag' }}
