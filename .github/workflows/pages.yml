name: Privacy policy

# Publishes the privacy policies on GitHub Pages. The Play Console wants a
# public, stable URL: the site holds nothing else, and is built from the files
# of the repository, so the text declared to Google cannot drift from the one
# under version control.
#
# GitHub Pages has to be enabled once, in "GitHub Actions" mode; a workflow's
# own token cannot do it:
#
#     gh api -X POST repos/c4software/gliff-client/pages -f build_type=workflow
on:
  push:
    branches: [main]
    paths:
      - 'store/privacy-policy-*.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Install the Markdown converter
        run: python3 -m pip install --quiet 'markdown==3.7'

      - name: Build the site
        run: |
          set -euo pipefail
          mkdir -p site

          cat > site/style.css <<'CSS'
          :root { color-scheme: light dark; }
          body {
            margin: 0 auto; padding: 2rem 1.25rem; max-width: 44rem;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            line-height: 1.6;
          }
          h1, h2 { line-height: 1.25; }
          table { border-collapse: collapse; width: 100%; }
          th, td { border: 1px solid #8884; padding: .5rem; text-align: left; vertical-align: top; }
          code { font-size: .95em; }
          nav { margin-bottom: 2rem; font-size: .95em; }
          CSS

          python3 - <<'PY'
          import markdown

          TEMPLATE = """<!doctype html>
          <html lang="{lang}">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>{title}</title>
              <link rel="stylesheet" href="style.css">
            </head>
            <body>
          <nav><a href="index.html">&#8592; Gliff Client</a></nav>
          {body}
            </body>
          </html>
          """

          pages = [
              ("store/privacy-policy-en.md", "en",
               "Privacy Policy — Gliff Client", "site/privacy-en.html"),
              ("store/privacy-policy-fr.md", "fr",
               "Politique de confidentialité — Gliff Client", "site/privacy-fr.html"),
          ]

          for source, lang, title, target in pages:
              with open(source, encoding="utf-8") as f:
                  body = markdown.markdown(f.read(), extensions=["tables"])
              with open(target, "w", encoding="utf-8") as f:
                  f.write(TEMPLATE.format(lang=lang, title=title, body=body))
              print(f"{source} -> {target}")
          PY

          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>Gliff Client — Privacy Policy</title>
              <link rel="stylesheet" href="style.css">
            </head>
            <body>
              <h1>Gliff Client</h1>
              <p>Privacy policy / Politique de confidentialité:</p>
              <ul>
                <li><a href="privacy-en.html">English</a></li>
                <li><a href="privacy-fr.html">Français</a></li>
              </ul>
              <p><a href="https://github.com/c4software/gliff-client">Source code</a>, MIT licence.</p>
            </body>
          </html>
          HTML

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
